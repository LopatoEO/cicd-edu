name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  lint-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'python'

      - name: Install dependencies
        run: |
          pip install ruff bandit

      # 🧹 Linting
      - name: Run Ruff (lint)
        run: |
          ruff check .

      # 🔐 Security scan
      - name: Run Bandit
        run: |
          bandit -r src -q

  test:
    needs: lint-and-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --with dev

      - name: Run tests
        run: |
          poetry run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/lopatoeo/cicd-edu:latest
            ghcr.io/lopatoeo/cicd-edu:${{ github.sha }}]
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted


    steps:
      - name: Pull latest image
        run: |
          docker pull ghcr.io/lopatoeo/cicd-edu:latest

      - name: Stop old container
        run: |
          docker stop app || true
          docker rm app || true

      - name: Run new container
        run: |
          docker run -d \
            --name app \
            -p 8000:8000 \
            ghcr.io/lopatoeo/cicd-edu:latest