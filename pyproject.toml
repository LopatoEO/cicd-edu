[project]
name = "ci_cd_edu"
version = "0.1.0"
description = ""
authors = [
    {name = "LopatoEO",email = "126246079+LopatoEO@users.noreply.github.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "httpx2 (>=2.4.0,<3.0.0)"
]

[tool.ruff]
line-length = 88
target-version = "py312"

include = ["*.py", "*.pyi"]

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.poetry]
package-mode = false

[tool.bandit]
exclude_dirs = ["tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # imports (isort)
    "B",   # bugbears
    "W",   # warnings
    "UP",  # pyupgrade
]

ignore = [
    "E501",  
]


fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
